; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 

[env:ESP8266]
platform = espressif8266 @ ^4.2.1
board = nodemcuv2
board_build.f_cpu = 160000000L
framework = arduino
; No CONT_STACKSIZE override: BearSSL runs on its own stack thunk, and growing
; the loop stack by 4 kB only steals heap from the TLS buffers (which is the
; resource this firmware is actually short of).
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#32655b72
    claws/BH1750@^1.3.0
extra_scripts = 
    pre:extra_scripts.py
    post:erase_before_upload.py

[env:ESP32]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#32655b72
    claws/BH1750@^1.3.0
extra_scripts = 
    pre:extra_scripts.py
    post:erase_before_upload.py

[env:ESP8285]
; ESP8285 = ESP8266 with 1 MB embedded flash. The firmware embeds the web
; page into the app binary and keeps settings in EEPROM, so no filesystem
; is needed and the ~1 MB app partition is enough (~625 KB used).
; DOUT is the flash mode required by the embedded flash of the ESP8285.
platform = espressif8266 @ ^4.2.1
board = esp01_1m
board_build.flash_mode = dout
board_build.f_cpu = 160000000L
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#32655b72
    claws/BH1750@^1.3.0
extra_scripts =
    pre:extra_scripts.py
    post:erase_before_upload.py

[env:ESP32C3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitc-02
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@^2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#32655b72
    claws/BH1750@^1.3.0
extra_scripts = 
    pre:extra_scripts.py
    post:erase_before_upload.py